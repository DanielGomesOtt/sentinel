services:
  db:
    image: postgres:17
    restart: always
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-tier
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_SENDER_HOST: ${SPRING_MAIL_SENDER_HOST}
      SPRING_MAIL_SENDER_PORT: ${SPRING_MAIL_SENDER_PORT}
      SPRING_MAIL_SENDER_USERNAME: ${SPRING_MAIL_SENDER_USERNAME}
      SPRING_MAIL_SENDER_PASSWORD: ${SPRING_MAIL_SENDER_PASSWORD}
      SMTP_MAIL: ${SMTP_MAIL}
    networks:
      - back-tier

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - back-tier

volumes:
  db-data:

networks:
  back-tier:
    driver: bridge
    name: back-tier
